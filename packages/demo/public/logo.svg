<svg viewBox="0 0 204 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
  </defs>

  <!-- Mark: rounded square -->
  <rect width="44" height="44" rx="10" fill="url(#a)"/>

  <!-- Angle brackets -->
  <path d="M12.5 15.5 L7.5 22 L12.5 28.5"
    stroke="rgba(255,255,255,0.45)" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M31.5 15.5 L36.5 22 L31.5 28.5"
    stroke="rgba(255,255,255,0.45)" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- me -->
  <text x="22" y="23"
    font-family="Roboto, system-ui, -apple-system, sans-serif"
    font-size="11" font-weight="800" fill="white"
    text-anchor="middle" letter-spacing="0.3" dominant-baseline="middle">me</text>

  <!-- Wordmark: "material" light + "elements" bold -->
  <text x="56" y="28"
    font-family="Roboto, system-ui, -apple-system, sans-serif"
    font-size="17.5" fill="white" letter-spacing="0">
    <tspan font-weight="300">material</tspan><tspan font-weight="700">elements</tspan>
  </text>
</svg>
